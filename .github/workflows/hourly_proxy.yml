name: MTProto Proxy Publisher (Every 30 Minutes)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  publish-proxies:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run proxy bot
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
      run: python main.py

    - name: Commit DB if changed
      run: |
        git config user.name "MTProto Bot"
        git config user.email "bot@local"
        git add published_proxies.db
        git diff --staged --quiet || git commit -m "chore: update published_proxies.db [skip ci]"
        git push

    - name: Notify on failure
      if: failure()
      run: echo "Bot execution failed!"
